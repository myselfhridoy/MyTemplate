[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/gemini"
  to = "/.netlify/functions/gemini"
  status = 200
  force = true

[[redirects]]
  from = "/api/gemma"
  to = "/.netlify/functions/CloudflareGemmaProxy"
  status = 200
  force = true

[[redirects]]
  from = "/api/github-proxy"
  to = "/.netlify/functions/github-proxy"
  status = 200
  force = true

[[redirects]]
  from = "/api/github-image"
  to = "/.netlify/functions/github-image"
  status = 200
  force = true
